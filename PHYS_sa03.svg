<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
  <rect x="0" y="0" width="900" height="330" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="326" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#4a3fa8">Q3  [2 marks]</text>
  <text x="36" y="106" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">A 0.50 kg ball moving at 4.0 m/s collides head-on with a</text>
  <text x="36" y="142" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">stationary 0.50 kg ball, and the two balls stick together after</text>
  <text x="36" y="178" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">the collision.</text>
  <text x="36" y="224" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">Calculate the common velocity of the two balls immediately after</text>
  <text x="36" y="260" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">the collision.</text>
  
</svg>