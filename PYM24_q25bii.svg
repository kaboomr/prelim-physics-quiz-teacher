<svg xmlns="http://www.w3.org/2000/svg" width="900" height="294" viewBox="0 0 900 294">
  <rect x="0" y="0" width="900" height="294" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="290" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#4a3fa8">Q25(b(ii))  [2 marks]</text>
  <text x="36" y="106" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">A ray of light travelling in air enters a transparent substance</text>
  <text x="36" y="142" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">which halves the speed of the light.</text>
  <text x="36" y="188" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">(ii) If the angle of incidence of the ray of light is 30 degrees,</text>
  <text x="36" y="224" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">find the angle of refraction.</text>
  
</svg>