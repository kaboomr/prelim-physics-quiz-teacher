<svg xmlns="http://www.w3.org/2000/svg" width="900" height="294" viewBox="0 0 900 294">
  <rect x="0" y="0" width="900" height="294" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="290" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#4a3fa8">Q31(a)  [2 marks]</text>
  <text x="36" y="106" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">Total internal reflection is used in many applications including</text>
  <text x="36" y="142" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">optical fibres.</text>
  <text x="36" y="188" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">Outline the conditions necessary for the total internal reflection</text>
  <text x="36" y="224" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">of light.</text>
  
</svg>