<svg xmlns="http://www.w3.org/2000/svg" width="900" height="534" viewBox="0 0 900 534">
  <rect x="0" y="0" width="900" height="534" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="530" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#4a3fa8">Q5  [3 marks]</text>
  <text x="36" y="106" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">The circuit below contains a 12 V battery connected in series with</text>
  <text x="36" y="142" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">two 4 ohm resistors.</text>
  <text x="36" y="188" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">(i) Calculate the total resistance of the circuit.</text>
  <text x="36" y="234" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">(ii) Calculate the current flowing in the circuit.</text>
  <g transform="translate(36,290)">
<rect x="60" y="10" width="700" height="180" fill="none" stroke="#1a1a2e" stroke-width="3"/>
<rect x="20" y="70" width="60" height="60" fill="#fff3d6" stroke="#c9971f" stroke-width="2.5"/>
<text x="50" y="105" text-anchor="middle" font-size="20" font-family="Helvetica, Arial, sans-serif" fill="#1a1a2e">12V</text>
<rect x="220" y="0" width="80" height="40" fill="#e2f3e2" stroke="#2e7d32" stroke-width="2.5"/>
<text x="260" y="26" text-anchor="middle" font-size="18" font-family="Helvetica, Arial, sans-serif" fill="#1a1a2e">4 ohm</text>
<rect x="520" y="0" width="80" height="40" fill="#e2f3e2" stroke="#2e7d32" stroke-width="2.5"/>
<text x="560" y="26" text-anchor="middle" font-size="18" font-family="Helvetica, Arial, sans-serif" fill="#1a1a2e">4 ohm</text>
</g>
</svg>