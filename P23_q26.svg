<svg xmlns="http://www.w3.org/2000/svg" width="900" height="248" viewBox="0 0 900 248">
  <rect x="0" y="0" width="900" height="248" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="244" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#4a3fa8">Q26  [4 marks]</text>
  <text x="36" y="106" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">Describe a procedure for a practical investigation that could be</text>
  <text x="36" y="142" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">safely performed to measure the acceleration of a toy car rolling</text>
  <text x="36" y="178" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">down an inclined plane.</text>
  
</svg>