<svg xmlns="http://www.w3.org/2000/svg" width="900" height="258" viewBox="0 0 900 258">
  <rect x="0" y="0" width="900" height="258" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="254" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#4a3fa8">Q27  [3 marks]</text>
  <text x="36" y="106" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">Rubbing a balloon against a cat&#x27;s fur causes the cat&#x27;s hairs to</text>
  <text x="36" y="142" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">stand up and be attracted towards the balloon.</text>
  <text x="36" y="188" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">Explain the movement of the cat&#x27;s hairs.</text>
  
</svg>