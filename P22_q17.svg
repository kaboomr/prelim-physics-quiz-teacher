  <text x="36" y="106" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">Helicopter X has velocity 150 kph on a bearing of 180 degrees.</text>
  <text x="36" y="142" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">Helicopter Y has velocity 250 kph on a bearing of 090 degrees.</text>
  <text x="36" y="188" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">By drawing an appropriate vector diagram, determine the velocity</text>
  <text x="36" y="224" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">of helicopter X relative to helicopter Y.</text>
  
