<svg xmlns="http://www.w3.org/2000/svg" width="900" height="366" viewBox="0 0 900 366">
  <rect x="0" y="0" width="900" height="366" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="362" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#4a3fa8">Q32  [3 marks]</text>
  <text x="36" y="106" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">Two identical objects have different temperatures. One of the</text>
  <text x="36" y="142" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">objects has a temperature T1 while the other has a temperature T2,</text>
  <text x="36" y="178" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">where T1 &gt; T2.</text>
  <text x="36" y="224" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">In terms of the kinetic energy of the particles in the two</text>
  <text x="36" y="260" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">objects, explain what happens when they are brought into contact</text>
  <text x="36" y="296" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">with each other.</text>
  
</svg>