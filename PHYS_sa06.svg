<svg xmlns="http://www.w3.org/2000/svg" width="900" height="284" viewBox="0 0 900 284">
  <rect x="0" y="0" width="900" height="284" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="280" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#4a3fa8">Q6  [2 marks]</text>
  <text x="36" y="106" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">A straight current-carrying wire is placed in a uniform magnetic</text>
  <text x="36" y="142" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">field, perpendicular to the field lines. Describe what happens to</text>
  <text x="36" y="178" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">the wire, and name the rule used to predict the direction of this</text>
  <text x="36" y="214" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">effect.</text>
  
</svg>